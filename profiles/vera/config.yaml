# MPCDF Vera configuration file
local-cores: 1

# Settings to continue running and keep incomplete
keep-going: True
keep-incomplete: True

# Max number of jobs
jobs: 200

# Queue system
executor: slurm
use-envmodules: True
slurm-no-account: True

# Default job requests
default-resources:
  runtime: 2880
  cpus_per_task: 72
  mem_mb: 250000
  slurm_partition: p.large

# Group components
group-components:
  download: 72
  stage1: 18
set-resources:
  download:
    mem_mb: 3472
  stage1:
    mem_mb: 13888  # per-file floor: fits 18 stage1 jobs on a 250 GB p.vera node
  preprocess:
    runtime: 2160
  mosaic:
    runtime: 720
